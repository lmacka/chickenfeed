name: Deploy chicky to Balena

on:
  push:
    paths:
      - 'chicky/**'

jobs:
  version-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Bump version in package.json
      - name: Bump version in package.json
        id: version-bump
        uses: phips28/gh-action-bump-version@master
        with:
          PACKAGEJSON_DIR: 'chicky'
          skip-push: 'true' # Let the next action push the changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Update version in balena.yml to match package.json
      - name: Update version in balena.yml
        uses: fjogeleit/yaml-update-action@main
        with:
          valueFile: 'chicky/balena.yml'
          propertyPath: 'version'
          value: ${{ steps.version-bump.outputs.newTag }}
          commitChange: true
          updateFile: true
          message: 'ci: update package.json & balena.yml version to ${{ steps.version-bump.outputs.newTag }}'
          branch: main

      # Deploy to Balena
      - name: Deploy to Balena
        uses: balena-io/deploy-to-balena-action@master
        id: balena-deploy
        with:
          balena_token: ${{ secrets.BALENA_TOKEN }}
          fleet: ${{ secrets.BALENA_FLEET }}
          environment: balena-cloud.com
          create_tag: true
          source: chicky
          layer_cache: true
          debug: false

      # Log release information
      - name: Log release information
        run: |
          echo "Built release ID ${{ steps.balena-deploy.outputs.release_id }}"
          echo "Release version ${{ steps.balena-deploy.outputs.version }}"