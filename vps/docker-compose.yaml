services:
  swag:
    restart: always
    image: linuxserver/swag:3.3.0
    environment:
      - URL=${URL}
      - VALIDATION=http
      - ONLY_SUBDOMAINS=false
      - STAGING=false
      - SUBDOMAINS=${SUBDOMAINS}
      - EXTRA_DOMAINS=${EXTRA_DOMAINS}
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Brisbane
      # Camera PTZ configuration
      - CAMERA_IP=${CAMERA_IP}
      - CAMERA_PORT=${CAMERA_PORT}
      - CAMERA_USERNAME=${CAMERA_USERNAME}
      - CAMERA_PASSWORD=${CAMERA_PASSWORD}
      - CAMERA_PAN_SPEED=${CAMERA_PAN_SPEED}
      - CAMERA_TILT_SPEED=${CAMERA_TILT_SPEED}
      - CAMERA_TIMEOUT=${CAMERA_TIMEOUT}
    volumes:
      - ./config:/config
      - ./custom-cont-init.d:/custom-cont-init.d
      - ./custom-services.d:/custom-services.d
    network_mode: host
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "test -f /config/keys/cert.key && test -f /config/keys/cert.crt"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: chickenfeed-server
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--accept-routes=true
    volumes:
      - ./tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    network_mode: host

  rtsp-proxy:
    restart: always
    image: bluenviron/mediamtx:1.11.3
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./config:/config:ro
    network_mode: host
    depends_on:
      tailscale:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "tailscale status | grep -q 'chickenfeed-server'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chicky-control:
    restart: always
    build: ./chicky-control
    environment:
      - PORT=3000
      - CHICKY_AUTH_TOKEN=${CHICKY_AUTH_TOKEN}
      # Chicky configuration (for raspberry pi)
      - chicky_servo_pin=${SERVO_PIN}
      - chicky_debug=false
      - chicky_allowed_start_time=${LIGHT_ON_TIME}
      - chicky_allowed_end_time=${LIGHT_OFF_TIME}
      - chicky_timezone_offset=${TIMEZONE_OFFSET}
    volumes:
      - ./chicky-control:/usr/src/app:rw
      - ./config/keys:/keys:ro
      - ./data/chat:/config/data:rw  # Persistent volume for chat history and logs
    network_mode: host
    depends_on:
      swag:
        condition: service_healthy