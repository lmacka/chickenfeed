server {
	listen 80;
	listen [::]:80;
	server_name _;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name onlychicks.tv chook.cam;
	include /config/nginx/ssl.conf;
	include /config/nginx/proxy-confs/*.subfolder.conf;
	location / {
		root /config/www/;
		index index.html;
		try_files $uri $uri/ =404;
	}
	location /api/ {
		proxy_pass http://localhost:3000/api/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
    # Socket.IO path - WebSockets only
    location /socket.io/ {
        proxy_pass http://localhost:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket settings
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    
    # PTZ API endpoint
    location ~ ^/ptz/(.+\.py)$ {
        # Enable CGI execution
        gzip off;
        root /config/www/cgi-bin;
        include /etc/nginx/fastcgi_params;
        fastcgi_pass unix:/config/run/fcgiwrap.socket;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_script_name;
    }

	# Video feed proxies
	location /feed/ {
		proxy_pass https://localhost:8888/proxied/;  # Let MediaMTX handle the SSL for iphone compatibility
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		
		# Add debugging headers
		add_header X-Debug-Info "HLS-Proxy" always;
		add_header Access-Control-Allow-Origin "*" always;
		
		# Increase timeouts for HLS
		proxy_read_timeout 300s;
	}
	location /feed_low/ {
		proxy_pass https://localhost:8888/proxied_lowres/;  # Let MediaMTX handle the SSL for iphone compatibility
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		
		# Add debugging headers
		add_header X-Debug-Info "HLS-Proxy" always;
		add_header Access-Control-Allow-Origin "*" always;
		
		# Increase timeouts for HLS
		proxy_read_timeout 300s;
	}
    location /webrtc/ {
        proxy_pass http://localhost:8889/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket settings
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # Disable buffering for WebRTC
        proxy_buffering off;
        
        # Add debugging headers
        add_header X-Debug-Info "WebRTC-Proxy" always;
        add_header Access-Control-Allow-Origin "*" always;
        
        # Add CORS headers for preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}

