version: '2'

services:
  chicky:
    build: .
    privileged: true
    restart: always
    network_mode: host
    labels:
      io.balena.features.kernel-modules: '1'
      io.balena.features.firmware: '1'
      io.balena.features.dbus: '1'
      io.balena.features.supervisor-api: '1'
      io.balena.features.balena-api: '1'
    volumes:
      # Persists the safety envelope's daily treat counter across restarts.
      - 'resin-data:/data'
    environment:
      - PORT=3000
      - LOG_LEVEL=INFO

  # 433MHz SDR receiver (NESDR on USB), relocated from the cluster to reach the
  # shed incubator sensors. Publishes rtl_433 JSON to the homelab broker; the
  # MQTT host and credentials are balena service variables, not committed.
  # privileged: raw USB access. Gotcha: if the dongle is plugged in after boot,
  # restart this service so it enumerates.
  rtl433:
    build: ./rtl433-sdr
    privileged: true
    restart: always

volumes:
  resin-data:
