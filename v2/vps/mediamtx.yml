# MediaMTX configuration for Chickenfeed v2
logLevel: info
# RTSP parameters
protocols:
    - tcp
rtspAddress: :8554
# HLS parameters for low latency streaming
hls: true
hlsAddress: :8888
hlsAllowOrigin: '*'
hlsTrustedProxies:
    - 0.0.0.0/0
hlsVariant: lowLatency
hlsSegmentCount: 50
hlsSegmentDuration: 1s
hlsPartDuration: 500ms
hlsSegmentMaxSize: 50M
hlsMuxerCloseAfter: 120s
# Path configurations
paths:
    feed:
        # Camera stream via direct IP
        source: rtsp://192.168.100.30:43825/a47a10ea5caeacba
        rtspTransport: tcp
        sourceOnDemand: true
        sourceOnDemandStartTimeout: 5s
        sourceOnDemandCloseAfter: 10s
    feed_lowres:
        # Low res stream if needed
        source: rtsp://192.168.100.30:43825/a2f76405009cb075
        rtspTransport: tcp
        sourceOnDemand: false
        sourceOnDemandStartTimeout: 5s
        sourceOnDemandCloseAfter: 10s
