# video.chook.cam - the grey-cloud video origin.
#
# Deliberately NOT behind the Cloudflare proxy: the CDN terms bar serving video
# on this plan. Only HTML/API goes through the orange cloud, on chook.cam.
#
# Paths are passed through UNCHANGED to mediamtx. Do not add a /hls/ prefix and
# rewrite it away: mediamtx 302-redirects the playlist to ?cookieCheck=1 using
# its own path, so a rewritten prefix escapes on the redirect and the follow-up
# request lands on the wrong upstream. Route on file type instead.
# CORS is owned by mediamtx (webrtcAllowOrigins / hlsAllowOrigins), NOT by
# nginx. Do not re-add Access-Control-* here: duplicating the header makes
# browsers reject the response with "contains multiple values '*, *'", which
# breaks cross-origin playback from chook.cam while curl still looks fine.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name video.chook.cam;

    include /config/nginx/ssl.conf;

    # HLS assets -> the HLS server. Fallback rung for clients that cannot do WebRTC.
    location ~* \.(m3u8|ts|mp4|m4s|key)$ {
        proxy_pass http://mediamtx:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    }

    # Prometheus scrape target. Behind basic auth: this is a public origin.
    location = /metrics {
        auth_basic "metrics";
        auth_basic_user_file /config/nginx/metrics.htpasswd;
        proxy_pass http://mediamtx:9998/metrics;
        proxy_set_header Host $host;
    }

    # Everything else -> the WebRTC server: WHEP signalling and the player page.
    # Media itself is SRTP straight to udp/8189 and does not pass through nginx.
    location / {
        proxy_pass http://mediamtx:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;

        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Expose-Headers' 'Location, ETag, Link' always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name video.chook.cam;
    return 301 https://$server_name$request_uri;
}
