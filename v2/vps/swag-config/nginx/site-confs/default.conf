# chook.cam - the public page.
#
# Static only for now: no application server, so no attack surface while the
# interactive app is rebuilt. The page plays the live stream from
# video.chook.cam over WHEP with an HLS fallback.
#
# The old chook-server (Go + htmx) is retired. It had stored XSS on both chat
# render paths and its video source and control paths no longer exist.
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;

    server_name chook.cam www.chook.cam;

    include /config/nginx/ssl.conf;

    root /config/www/site;
    index index.html;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location /static/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # The old app's endpoints are gone for good, not merely unavailable.
    location ~ ^/(events|chat|api)(/|$) {
        return 410;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name chook.cam www.chook.cam;
    return 301 https://$server_name$request_uri;
}
