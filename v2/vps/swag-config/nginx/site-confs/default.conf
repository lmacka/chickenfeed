server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name chook.cam www.chook.cam;

    # SSL configuration (managed by SWAG)
    include /config/nginx/ssl.conf;

    # Main site - proxy to chook-server
    location / {
        proxy_pass http://tailscale:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # SSE endpoint - special handling for Server-Sent Events
    location /events {
        proxy_pass http://tailscale:3000/events;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }

    # HLS stream from MediaMTX
    location /hls/ {
        proxy_pass http://tailscale:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # CORS headers for HLS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    }

    # CGI script for PTZ control (if keeping CGI approach)
    location ~ ^/cgi-bin/ptz/(.+\.py)$ {
        gzip off;
        root /config/www;
        fastcgi_pass unix:/var/run/fcgiwrap.socket;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /config/www/cgi-bin/ptz/$1;
    }
}

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chook.cam www.chook.cam;
    return 301 https://$server_name$request_uri;
}