# notes.chook.cam - the Remark42 guestbook, embedded on chook.cam.
#
# Grey cloud like video: SWAG renews the cert by HTTP-01, so the name must
# resolve to this box, not to Cloudflare. The comment API is public by
# design; remark42 rate-limits by client IP, which is why X-Real-IP matters.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name notes.chook.cam;

    include /config/nginx/ssl.conf;

    location / {
        proxy_pass http://remark42:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name notes.chook.cam;
    return 301 https://$server_name$request_uri;
}
