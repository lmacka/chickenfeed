services:
  # SWAG - Nginx/Let's Encrypt container.
  # Scoped to video.chook.cam ALONE. It used to cover chook.cam and www too,
  # but those now resolve to Cloudflare, so HTTP-01 for them cannot reach this
  # box, and certbot fails the whole certificate if any name in it fails.
  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Brisbane
      - URL=video.chook.cam
      - VALIDATION=http
      - SUBDOMAINS=
      # notes.chook.cam must be a grey-cloud A record to this box BEFORE this
      # is deployed: certbot fails the whole cert if any name in it fails
      # HTTP-01, which would take video's TLS down at the next renewal.
      - EXTRA_DOMAINS=notes.chook.cam
      - CERTPROVIDER=
      - EMAIL=${SWAG_EMAIL}
      - STAGING=false
    volumes:
      - ./swag-config:/config
    ports:
      - "443:443"
      - "80:80"
    restart: unless-stopped
    networks:
      - chook-net

  # MediaMTX - the video relay. The cluster PUSHES to it over SRT; this box
  # never reaches into the home network. Runs on the bridge (not in the
  # tailscale netns) so SRT/ICE ports land on the host and swag can reach it
  # by name. Pinned: :latest previously drifted unnoticed.
  mediamtx:
    image: bluenviron/mediamtx:1.19.3
    container_name: mediamtx
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    ports:
      - "8890:8890/udp"   # SRT ingest from the cluster
      - "8189:8189/udp"   # WebRTC ICE
    restart: unless-stopped
    networks:
      - chook-net

  # Remark42 - the visitor guestbook at notes.chook.cam, embedded on chook.cam
  # as a floating window. Anonymous-only auth; visitors pick a display name.
  # State is a single BoltDB file under ./remark42-data (runs as uid 1001, so
  # chown the dir once at creation). Reachable only via swag; nothing else on
  # this box or the home network is in its blast radius.
  remark42:
    image: umputun/remark42:v1.16.4
    container_name: remark42
    environment:
      - REMARK_URL=https://notes.chook.cam
      - SECRET=${REMARK_SECRET}
      - SITE=chookcam
      - AUTH_ANON=true
      - EDIT_TIME=5m
      - MAX_COMMENT_SIZE=1000
      # After Liam's first anonymous login, put his user id here (visible in
      # the avatar menu / /api/v1/user) to unlock delete+block moderation:
      # - ADMIN_SHARED_ID=anonymous_...
    volumes:
      - ./remark42-data:/srv/var
    restart: unless-stopped
    networks:
      - chook-net

networks:
  chook-net:
    driver: bridge

