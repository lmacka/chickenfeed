<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chook.cam - Live Chicken Cam</title>
<meta name="description" content="A live view of my backyard chicken coop.">

<meta property="og:type" content="website">
<meta property="og:url" content="https://chook.cam/">
<meta property="og:title" content="Chook.cam - For the love of chooks!">
<meta property="og:description" content="A live view of my backyard chicken coop.">
<meta property="og:image" content="https://chook.cam/static/screenshot-lg.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Chook.cam - For the love of chooks!">
<meta name="twitter:description" content="A live view of my backyard chicken coop.">
<meta name="twitter:image" content="https://chook.cam/static/screenshot-lg.png">

<link rel="icon" type="image/webp" href="/static/favicon.webp">
<style>
  :root{
    --bg:#0a0a0a; --panel:#1a1a1a; --ink:#e0e0e0; --dim:#a0a0a0;
    --line:#333; --green:#00ff00; --amber:#ffb347; --red:#ff3333;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
       font-family:'Courier New',ui-monospace,monospace;display:flex;flex-direction:column}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.25rem;
         padding:.7rem 1rem;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{margin:0;font-size:1.05rem;letter-spacing:.06em;font-weight:700}
  .status{display:flex;align-items:center;gap:.45rem;font-size:.78rem;
          letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--dim);flex:none}
  .dot.live{background:var(--green);box-shadow:0 0 0 3px rgba(0,255,0,.18)}
  .dot.warn{background:var(--amber);box-shadow:0 0 0 3px rgba(255,179,71,.18)}
  .dot.down{background:var(--red);box-shadow:0 0 0 3px rgba(255,51,51,.18)}
  .spacer{margin-left:auto}
  a{color:var(--amber);text-decoration:none;font-size:.78rem;letter-spacing:.06em}
  a:hover,a:focus-visible{text-decoration:underline;outline:none}
  main{flex:1;display:grid;place-items:center;padding:1rem;min-height:0}
  .stage{width:100%;max-width:1600px;aspect-ratio:16/9;background:#000;
         border:1px solid var(--line);position:relative;overflow:hidden}
  video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
           padding:1.5rem;background:rgba(10,10,10,.82);font-size:.85rem;color:var(--dim);
           line-height:1.7;transition:opacity .3s}
  .overlay[hidden]{display:none}
  .overlay b{color:var(--ink);display:block;margin-bottom:.5rem;font-size:1rem}
  .mode{position:absolute;left:.6rem;bottom:.6rem;font-size:.66rem;letter-spacing:.12em;
        text-transform:uppercase;color:var(--dim);background:rgba(10,10,10,.7);
        padding:.2rem .45rem;border:1px solid var(--line)}
  footer{padding:.75rem 1rem;border-top:1px solid var(--line);background:var(--panel);
         font-size:.72rem;letter-spacing:.06em;color:#7a7a7a;text-align:center;line-height:1.8}
  button.retry{margin-top:.9rem;background:#2a2a2a;color:var(--ink);border:1px solid var(--line);
          padding:.5rem 1rem;font-family:inherit;font-size:.8rem;cursor:pointer;letter-spacing:.06em}
  button.retry:hover{background:#3a3a3a}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>&#128020; CHOOK.CAM</h1>
  <span class="status"><span class="dot" id="dot"></span><span id="statusText">connecting</span></span>
  <span class="spacer"></span>
  <a href="https://github.com/lmacka/chickenfeed" target="_blank" rel="noopener">GitHub</a>
</header>

<main>
  <div class="stage">
    <video id="v" autoplay muted playsinline controls></video>
    <div class="overlay" id="ov">
      <div>
        <b>Connecting to the coop&hellip;</b>
        If the chickens are asleep it will be dark. That is normal.
      </div>
    </div>
    <span class="mode" id="mode"></span>
  </div>
</main>

<footer>
  Treats, lights and camera controls are being rebuilt and will return.<br>
  Live video &middot; the coop is in South East Queensland
</footer>

<script src="/static/hls.min.js"></script>
<script>
(function () {
  // The video origin is a separate hostname on purpose. It is deliberately NOT
  // behind the Cloudflare proxy, because Cloudflare's terms bar serving video
  // through the CDN on this plan. Only this page rides the proxy.
  var ORIGIN = 'https://video.chook.cam';
  var PATH   = 'coop';

  var v = document.getElementById('v');
  var ov = document.getElementById('ov');
  var dot = document.getElementById('dot');
  var statusText = document.getElementById('statusText');
  var modeEl = document.getElementById('mode');
  var pc = null, hls = null, settled = false;

  function setStatus(cls, text) {
    dot.className = 'dot ' + cls;
    statusText.textContent = text;
  }
  function hideOverlay() {
    settled = true;
    ov.hidden = true;
    setStatus('live', 'live');
  }
  function fail(msg) {
    ov.hidden = false;
    ov.innerHTML = '<div><b>' + msg + '</b>The stream may be restarting. ' +
      'It reconnects on its own.<br><button class="retry" id="rt">Try again</button></div>';
    document.getElementById('rt').onclick = function () { location.reload(); };
    setStatus('down', 'offline');
    modeEl.textContent = '';
  }

  v.addEventListener('playing', hideOverlay);

  // --- WHEP (WebRTC) first: sub-second latency, which is the whole point of an
  // interactive coop cam. Falls back to HLS if WebRTC cannot get through.
  function startWhep() {
    setStatus('warn', 'connecting');
    modeEl.textContent = 'webrtc';
    pc = new RTCPeerConnection({ iceServers: [] });
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.ontrack = function (e) { v.srcObject = e.streams[0]; };
    pc.onconnectionstatechange = function () {
      if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
        if (!settled) startHls('WebRTC could not connect');
      }
    };

    pc.createOffer()
      .then(function (offer) { return pc.setLocalDescription(offer); })
      .then(function () {
        // Wait for ICE gathering rather than trickling: mediamtx accepts a
        // complete offer, and this avoids needing the WHEP PATCH flow.
        return new Promise(function (resolve) {
          if (pc.iceGatheringState === 'complete') return resolve();
          var t = setTimeout(resolve, 3000);
          pc.onicegatheringstatechange = function () {
            if (pc.iceGatheringState === 'complete') { clearTimeout(t); resolve(); }
          };
        });
      })
      .then(function () {
        return fetch(ORIGIN + '/' + PATH + '/whep', {
          method: 'POST',
          headers: { 'Content-Type': 'application/sdp' },
          body: pc.localDescription.sdp
        });
      })
      .then(function (res) {
        if (!res.ok) throw new Error('WHEP ' + res.status);
        return res.text();
      })
      .then(function (answer) {
        return pc.setRemoteDescription({ type: 'answer', sdp: answer });
      })
      .catch(function (err) {
        startHls('WebRTC unavailable (' + err.message + ')');
      });

    // If WebRTC has not produced pictures in time, stop waiting on it.
    setTimeout(function () { if (!settled) startHls('WebRTC timed out'); }, 9000);
  }

  // --- HLS fallback. Higher latency, but it gets through almost anywhere.
  function startHls(why) {
    if (settled || hls !== null) return;
    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
    console.warn('Falling back to HLS:', why);
    modeEl.textContent = 'hls';
    setStatus('warn', 'connecting');
    var url = ORIGIN + '/' + PATH + '/index.m3u8';

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ lowLatencyMode: false, backBufferLength: 30 });
      hls.loadSource(url);
      hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        v.play().catch(function () {});
      });
      hls.on(Hls.Events.ERROR, function (_e, data) {
        if (data && data.fatal && !settled) fail('Cannot reach the stream');
      });
    } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari plays HLS natively.
      v.src = url;
      v.play().catch(function () {});
    } else {
      fail('This browser cannot play the stream');
    }
  }

  startWhep();
})();
</script>
</body>
</html>
