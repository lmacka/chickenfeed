<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chook.cam - Live Chicken Cam</title>
<meta name="description" content="Watch my backyard chickens live. Drive the camera and dispense treats.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chook.cam/">
<meta property="og:title" content="Chook.cam - For the love of chooks!">
<meta property="og:description" content="Watch my backyard chickens live. Drive the camera and dispense treats.">
<meta property="og:image" content="https://chook.cam/static/screenshot-lg.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Chook.cam - For the love of chooks!">
<meta name="twitter:image" content="https://chook.cam/static/screenshot-lg.png">
<link rel="icon" type="image/webp" href="/static/favicon.webp?v={{.AssetVersion}}">
<link rel="stylesheet" href="/static/console.css?v={{.AssetVersion}}">
{{if .TurnstileKey}}<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>{{end}}
</head>
<body>

<div class="player" id="player">
  <video id="v" class="stage" autoplay muted playsinline></video>
  <div class="stage-overlay" id="ov">
    <div><b>Connecting to the coop&hellip;</b><span id="ovsub">If the chickens are asleep it will be dark. That is normal.</span></div>
  </div>
</div>

<!-- Always visible, never fades fully: the reading people actually want. -->
<div class="pill" id="pill">
  <span class="dot" id="coopdot"></span>
  <span id="pilltext">connecting</span>
  <span class="sep">&middot;</span>
  <a href="https://github.com/lmacka/chickenfeed" target="_blank" rel="noopener">github</a>
</div>

<!-- Player chrome. Fades when idle, returns on any input, and stays put while
     the visitor holds the console so a turn is never lost to a fade. -->
<div class="dock" id="dock">
  <div class="dockrow">
    {{range .Presets}}
    <button class="btn ptz" data-preset="{{.Token}}">{{.Name}}</button>
    {{end}}
    <span class="spacer"></span>
    <button class="btn aux" id="treat">&#127807; Treat</button>
    <button class="btn aux" id="light">&#128161; Light</button>
    <button class="btn aux" id="fs" title="Fullscreen">&#9974;</button>
    <span class="seat" id="seat"></span>
  </div>
  <div class="msg" id="msg"></div>
  <!-- Managed widget: renders invisibly and only shows if Cloudflare decides to
       challenge. Solving happens on load so the first control press is instant. -->
  <div class="turnstile" id="turnstile-holder">
    {{if .TurnstileKey}}<div class="cf-turnstile"
         data-sitekey="{{.TurnstileKey}}"
         data-action="turnstile-spin-v2"
         data-theme="dark"
         data-size="flexible"></div>{{end}}
  </div>
</div>

<script src="/static/hls.min.js?v={{.AssetVersion}}"></script>
<script>
(function () {
  var VIDEO_ORIGIN  = {{.VideoOrigin}};
  var VIDEO_PATH    = {{.VideoPath}};
  var HAS_TURNSTILE = {{if .TurnstileKey}}true{{else}}false{{end}};

  var $ = function (id) { return document.getElementById(id); };
  var tokenKey = 'chookControlToken';
  var myToken = sessionStorage.getItem(tokenKey) || '';
  var settled = false, pc = null, hls = null;
  var driving = false, busy = false;

  // ---------- stream: WHEP first, HLS fallback ----------
  var v = $('v'), ov = $('ov');
  v.addEventListener('playing', function () { settled = true; ov.hidden = true; });

  function startWhep() {
    pc = new RTCPeerConnection({ iceServers: [] });
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.ontrack = function (e) { v.srcObject = e.streams[0]; };
    pc.onconnectionstatechange = function () {
      if (!settled && (pc.connectionState === 'failed' || pc.connectionState === 'disconnected')) startHls();
    };
    pc.createOffer()
      .then(function (o) { return pc.setLocalDescription(o); })
      .then(function () {
        return new Promise(function (res) {
          if (pc.iceGatheringState === 'complete') return res();
          var t = setTimeout(res, 3000);
          pc.onicegatheringstatechange = function () {
            if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); }
          };
        });
      })
      .then(function () {
        return fetch(VIDEO_ORIGIN + '/' + VIDEO_PATH + '/whep', {
          method: 'POST', headers: { 'Content-Type': 'application/sdp' },
          body: pc.localDescription.sdp
        });
      })
      .then(function (r) { if (!r.ok) throw new Error('WHEP ' + r.status); return r.text(); })
      .then(function (sdp) { return pc.setRemoteDescription({ type: 'answer', sdp: sdp }); })
      .catch(function () { startHls(); });
    setTimeout(function () { if (!settled) startHls(); }, 9000);
  }

  function startHls() {
    if (settled || hls) return;
    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
    var url = VIDEO_ORIGIN + '/' + VIDEO_PATH + '/index.m3u8';
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ lowLatencyMode: false, backBufferLength: 30 });
      hls.loadSource(url); hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, function () { v.play().catch(function () {}); });
    } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = url; v.play().catch(function () {});
    } else {
      $('ovsub').textContent = 'This browser cannot play the stream.';
    }
  }
  startWhep();

  // ---------- fullscreen ----------
  // On a phone this is the difference between a letterboxed strip and a usable
  // picture, so the video itself is tappable too, not just the button.
  function toggleFullscreen() {
    var el = $('player');
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return;
    }
    var req = el.requestFullscreen || el.webkitRequestFullscreen || v.webkitEnterFullscreen;
    if (!req) return;
    var p = req.call(req === v.webkitEnterFullscreen ? v : el);
    // Best effort: landscape is what makes a 16:9 stream worth fullscreening.
    if (p && p.then && screen.orientation && screen.orientation.lock) {
      p.then(function () { screen.orientation.lock('landscape').catch(function () {}); })
       .catch(function () {});
    }
  }
  $('fs').addEventListener('click', toggleFullscreen);
  v.addEventListener('dblclick', toggleFullscreen);
  // Single tap on touch devices, where dblclick is awkward.
  v.addEventListener('touchend', function (e) { e.preventDefault(); toggleFullscreen(); }, { passive: false });

  // ---------- chrome auto-hide ----------
  var dock = $('dock'), pill = $('pill'), idleTimer = null;
  function wake() {
    dock.classList.remove('idle'); pill.classList.remove('idle');
    clearTimeout(idleTimer);
    if (window.matchMedia('(orientation: portrait)').matches) return;
    idleTimer = setTimeout(function () {
      // Never fade while the visitor holds the console, or while a challenge
      // is on screen: losing either to a timeout would feel broken.
      if (driving || $('turnstile-holder').offsetHeight > 0) return;
      if (dock.matches(':hover') || dock.contains(document.activeElement)) return;
      dock.classList.add('idle'); pill.classList.add('idle');
    }, 3500);
  }
  ['mousemove','mousedown','touchstart','keydown','wheel'].forEach(function (e) {
    window.addEventListener(e, wake, { passive: true });
  });
  dock.addEventListener('mouseenter', wake);
  wake();

  // ---------- console ----------
  function say(t, cls) {
    var m = $('msg');
    m.textContent = t || '';
    m.className = 'msg' + (cls ? ' ' + cls : '');
    wake();
  }

  function post(path, params) {
    var body = new URLSearchParams(params || {});
    if (myToken) body.set('token', myToken);
    return fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); });
  }

  // Turnstile tokens are SINGLE USE and expire after 300s. Reset after every
  // attempt, or the next press replays a spent token, siteverify returns
  // timeout-or-duplicate, and the visitor is locked out until they reload.
  function resetTurnstile() {
    if (window.turnstile) { try { window.turnstile.reset(); } catch (e) {} }
  }
  function turnstileToken() {
    var f = document.querySelector('[name="cf-turnstile-response"]');
    return f ? f.value : '';
  }

  // No explicit "request control" step. The seat is claimed implicitly on the
  // first control press, so the queue only ever surfaces during contention.
  function ensureSeat() {
    if (driving) return Promise.resolve(true);
    var params = {};
    if (HAS_TURNSTILE) {
      var t = turnstileToken();
      if (!t) {
        $('turnstile-holder').hidden = false;
        say('confirm you are human, then press again', 'warn');
        return Promise.resolve(false);
      }
      params['cf-turnstile-response'] = t;
    }
    say('taking the console...');
    return post('/api/queue/join', params).then(function (r) {
      resetTurnstile();
      if (!r.ok) {
        say((r.body.error || 'refused').toLowerCase(), 'err');
        $('turnstile-holder').hidden = false;
        return false;
      }
      myToken = r.body.token;
      sessionStorage.setItem(tokenKey, myToken);
      $('turnstile-holder').hidden = true;
      if (r.body.driving) { driving = true; return true; }
      say('someone else is driving. you are #' + r.body.position + ' in line', 'warn');
      return false;
    });
  }

  function act(label, fn) {
    if (busy) return;
    busy = true;
    ensureSeat().then(function (ok) {
      if (!ok) { busy = false; refresh(); return; }
      say(label + '...');
      return fn().then(function (r) {
        say(r.ok ? label + ' ok' : (r.body.error || 'failed').toLowerCase(), r.ok ? null : 'err');
        busy = false;
        refresh();
      });
    }).catch(function () { busy = false; });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.ptz'), function (b) {
    b.addEventListener('click', function () {
      act(b.textContent.trim().toLowerCase(), function () {
        return post('/api/ptz', { preset: b.dataset.preset });
      });
    });
  });

  $('treat').addEventListener('click', function () {
    act('treat', function () { return post('/api/treat'); });
  });

  $('light').addEventListener('click', function () {
    var want = $('light').classList.contains('on') ? 'off' : 'on';
    act('light ' + want, function () { return post('/api/light', { state: want }); });
  });

  // ---------- state ----------
  function refresh() {
    var h = myToken ? { 'X-Control-Token': myToken } : {};
    fetch('/api/state', { headers: h }).then(function (r) { return r.json(); }).then(function (s) {
      $('coopdot').className = 'dot ' + (s.coop.online ? 'ok' : 'bad');

      var bits = [];
      if (s.coop.has_climate) {
        bits.push(s.coop.climate.temperature.toFixed(1) + 'C');
        bits.push(s.coop.climate.humidity.toFixed(0) + '%');
      }
      $('pilltext').textContent = s.coop.online ? (bits.join('  ') || 'live') : 'coop offline';

      var wasDriving = driving;
      driving = s.you.driving;

      if (driving) {
        $('seat').textContent = 'yours ' + s.you.seconds_left + 's';
        $('seat').className = 'seat live';
        wake();
      } else {
        if (wasDriving) {
          // Turn ended. Drop the spent token: keeping it would make the next
          // press fail our own cooldown check for a seat we no longer hold.
          myToken = '';
          sessionStorage.removeItem(tokenKey);
          say('turn over, press anything to queue again', 'warn');
        }
        if (s.you.in_queue && s.you.position > 0) {
          $('seat').textContent = '#' + s.you.position + ' in line';
          $('seat').className = 'seat wait';
        } else if (s.queue.occupied) {
          $('seat').textContent = 'in use ' + s.queue.seconds_left + 's';
          $('seat').className = 'seat busy';
        } else {
          $('seat').textContent = '';
          $('seat').className = 'seat';
        }
      }

      $('light').classList.toggle('on', s.coop.light_state === 'ON');
      $('treat').disabled = s.coop.has_status && !s.coop.status.treats_allowed;
      $('treat').title = ($('treat').disabled && s.coop.status.reason) || 'Dispense a treat';
    }).catch(function () {});
  }

  refresh();
  setInterval(refresh, 2000);
})();
</script>
</body>
</html>
