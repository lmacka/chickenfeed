<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chook.cam - Live Chicken Cam</title>
<meta name="description" content="Watch my backyard chickens live. Drive the camera and dispense treats.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chook.cam/">
<meta property="og:title" content="Chook.cam - For the love of chooks!">
<meta property="og:description" content="Watch my backyard chickens live. Drive the camera and dispense treats.">
<meta property="og:image" content="https://chook.cam/static/screenshot-lg.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Chook.cam - For the love of chooks!">
<meta name="twitter:image" content="https://chook.cam/static/screenshot-lg.png">
<link rel="icon" type="image/webp" href="/static/favicon.webp?v={{.AssetVersion}}">
<link rel="stylesheet" href="/static/console.css?v={{.AssetVersion}}">
{{if .TurnstileKey}}<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>{{end}}
</head>
<body>

<header class="hd" id="hd">
  <a class="brand" href="/">chook<b>.cam</b></a>
  <span class="livechip"><span class="dot"></span>LIVE</span>
  <span class="meta" id="meta"></span>
</header>

<div class="vidwrap" id="vidwrap">
  <video id="v" class="stage-video" autoplay muted playsinline></video>
  <div class="stage-overlay" id="ov">
    <div><b>Connecting to the brooder&hellip;</b><span id="ovsub">If the chicks are asleep it will be dark. That is normal.</span></div>
  </div>
  <button class="fstap" id="fs" title="Fullscreen" aria-label="Fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>
  </button>
</div>

<div class="hud" id="hud">
  <div class="views" id="views">
    {{range .Presets}}
    <button class="vbtn" data-preset="{{.Token}}">{{.Name}}</button>
    {{end}}
  </div>
  <div class="ctlrow">
    <button class="lightdial" id="light" aria-label="Brooder light">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.8.6 1.5 1.9 1.5 2.6h4c0-.7.7-2 1.5-2.6A6 6 0 0 0 12 3z"/></svg>
    </button>
    <button class="treatdial" id="treat">
      <svg class="ring" viewBox="0 0 77 77" aria-hidden="true">
        <circle class="track" cx="38.5" cy="38.5" r="34.5"/>
        <circle class="arc" id="arc" cx="38.5" cy="38.5" r="34.5"/>
      </svg>
      <span class="lbl" id="treatlbl">Treat</span>
    </button>
  </div>
  <div class="sleepchip">The chicks are asleep. <b>Back at sunrise.</b></div>
  <!-- Managed widget: renders invisibly and only shows if Cloudflare decides
       to challenge. Solving happens on load so the first press is instant. -->
  <div class="turnstile" id="turnstile-holder">
    {{if .TurnstileKey}}<div class="cf-turnstile"
         data-sitekey="{{.TurnstileKey}}"
         data-action="turnstile-spin-v2"
         data-theme="dark"
         data-size="flexible"></div>{{end}}
  </div>
</div>

<script src="/static/hls.min.js?v={{.AssetVersion}}"></script>
<script>
(function () {
  var VIDEO_ORIGIN  = {{.VideoOrigin}};
  var VIDEO_PATH    = {{.VideoPath}};
  var TREAT_PRESET  = {{.TreatPreset}};
  var HAS_TURNSTILE = {{if .TurnstileKey}}true{{else}}false{{end}};

  var $ = function (id) { return document.getElementById(id); };
  var tokenKey = 'chookControlToken';
  var myToken = sessionStorage.getItem(tokenKey) || '';
  var settled = false, pc = null, hls = null;
  var driving = false, busy = false;
  var wait = 0, waitTotal = 0, ticker = null;

  // ---------- stream: WHEP first, HLS fallback ----------
  var v = $('v'), ov = $('ov');
  v.addEventListener('playing', function () { settled = true; ov.hidden = true; });

  function startWhep() {
    pc = new RTCPeerConnection({ iceServers: [] });
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.ontrack = function (e) { v.srcObject = e.streams[0]; };
    pc.onconnectionstatechange = function () {
      if (!settled && (pc.connectionState === 'failed' || pc.connectionState === 'disconnected')) startHls();
    };
    pc.createOffer()
      .then(function (o) { return pc.setLocalDescription(o); })
      .then(function () {
        return new Promise(function (res) {
          if (pc.iceGatheringState === 'complete') return res();
          var t = setTimeout(res, 3000);
          pc.onicegatheringstatechange = function () {
            if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); }
          };
        });
      })
      .then(function () {
        return fetch(VIDEO_ORIGIN + '/' + VIDEO_PATH + '/whep', {
          method: 'POST', headers: { 'Content-Type': 'application/sdp' },
          body: pc.localDescription.sdp
        });
      })
      .then(function (r) { if (!r.ok) throw new Error('WHEP ' + r.status); return r.text(); })
      .then(function (sdp) { return pc.setRemoteDescription({ type: 'answer', sdp: sdp }); })
      .catch(function () { startHls(); });
    setTimeout(function () { if (!settled) startHls(); }, 9000);
  }

  function startHls() {
    if (settled || hls) return;
    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
    var url = VIDEO_ORIGIN + '/' + VIDEO_PATH + '/index.m3u8';
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ lowLatencyMode: false, backBufferLength: 30 });
      hls.loadSource(url); hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, function () { v.play().catch(function () {}); });
    } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = url; v.play().catch(function () {});
    } else {
      $('ovsub').textContent = 'This browser cannot play the stream.';
    }
  }
  startWhep();

  // ---------- fullscreen ----------
  function toggleFullscreen() {
    var el = $('vidwrap');
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return;
    }
    var req = el.requestFullscreen || el.webkitRequestFullscreen || v.webkitEnterFullscreen;
    if (!req) return;
    var p = req.call(req === v.webkitEnterFullscreen ? v : el);
    // Landscape is what makes a 16:9 stream worth fullscreening on a phone.
    if (p && p.then && screen.orientation && screen.orientation.lock) {
      p.then(function () { screen.orientation.lock('landscape').catch(function () {}); })
       .catch(function () {});
    }
  }
  $('fs').addEventListener('click', toggleFullscreen);
  v.addEventListener('dblclick', toggleFullscreen);

  // ---------- landscape idle fade: the TV shows only chickens ----------
  var idleTimer = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    if (window.matchMedia('(orientation: portrait)').matches) return;
    idleTimer = setTimeout(function () {
      // Never fade mid-action or while a challenge is on screen.
      if (driving || busy || $('turnstile-holder').offsetHeight > 0) return;
      var hud = $('hud');
      if (hud.matches(':hover') || hud.contains(document.activeElement)) return;
      document.body.classList.add('idle');
    }, 3500);
  }
  ['mousemove','mousedown','touchstart','keydown','wheel'].forEach(function (e) {
    window.addEventListener(e, wake, { passive: true });
  });
  wake();

  // ---------- turnstile ----------
  // Tokens are SINGLE USE and expire after 300s. Reset after every attempt,
  // or the next press replays a spent token and siteverify refuses it.
  function resetTurnstile() {
    if (window.turnstile) { try { window.turnstile.reset(); } catch (e) {} }
  }
  function turnstileToken() {
    var f = document.querySelector('[name="cf-turnstile-response"]');
    return f ? f.value : '';
  }

  // ---------- console ----------
  function post(path, params) {
    var body = new URLSearchParams(params || {});
    if (myToken) body.set('token', myToken);
    return fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); });
  }

  // The seat is claimed implicitly on the first press. There is no queue
  // prose: while someone else drives, the controls are simply greyed out by
  // the state poll, and they come back when the seat frees.
  function ensureSeat() {
    if (driving) return Promise.resolve(true);
    var params = {};
    if (HAS_TURNSTILE) {
      var t = turnstileToken();
      if (!t) {
        $('turnstile-holder').hidden = false;
        return Promise.resolve(false);
      }
      params['cf-turnstile-response'] = t;
    }
    return post('/api/queue/join', params).then(function (r) {
      resetTurnstile();
      if (!r.ok) {
        $('turnstile-holder').hidden = false;
        return false;
      }
      myToken = r.body.token;
      sessionStorage.setItem(tokenKey, myToken);
      $('turnstile-holder').hidden = true;
      driving = !!r.body.driving;
      return driving;
    });
  }

  function act(fn) {
    if (busy) return Promise.resolve();
    return ensureSeat().then(function (ok) {
      if (!ok) { refresh(); return; }
      return fn().then(function () { refresh(); });
    }).catch(function () {});
  }

  Array.prototype.forEach.call(document.querySelectorAll('.vbtn'), function (b) {
    b.addEventListener('click', function () {
      act(function () {
        markView(b.dataset.preset);
        return post('/api/ptz', { preset: b.dataset.preset });
      });
    });
  });

  function markView(token) {
    Array.prototype.forEach.call(document.querySelectorAll('.vbtn'), function (x) {
      x.classList.toggle('on', x.dataset.preset === token);
    });
  }

  var treat = $('treat'), treatlbl = $('treatlbl'), arc = $('arc');

  $('light').addEventListener('click', function () {
    var want = $('light').classList.contains('on') ? 'off' : 'on';
    act(function () { return post('/api/light', { state: want }); });
  });

  treat.addEventListener('click', function () {
    if (busy || treat.disabled) return;
    act(function () {
      // The server swings the camera to the feeder, settles, then dispenses;
      // this request stays open the whole time. Show it.
      busy = true;
      treat.classList.add('busy');
      treatlbl.innerHTML = 'here it<br>comes';
      if (TREAT_PRESET) markView(TREAT_PRESET);
      var done = function () {
        busy = false;
        treat.classList.remove('busy');
      };
      return post('/api/treat').then(done, done);
    });
  });

  // ---------- state ----------
  function fmt(sec) {
    if (sec >= 3600) return Math.floor(sec / 3600) + 'h ' + Math.floor((sec % 3600) / 60) + 'm';
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function renderTreat(s) {
    if (busy) return;
    var st = s.coop.status, has = s.coop.has_status;
    if (!has || !s.coop.online) {
      treat.disabled = true;
      treatlbl.innerHTML = 'Treat';
      arc.style.strokeDashoffset = 216;
      return;
    }
    if (!st.daylight) {
      treat.disabled = true;
      treatlbl.innerHTML = 'Treat<small>back at sunrise</small>';
      arc.style.strokeDashoffset = 216;
      return;
    }
    if (!st.treats_allowed && wait > 0) {
      treat.disabled = true;
      var sub = st.treats_remaining === 0 ? 'done for today' : 'next treat';
      treatlbl.innerHTML = fmt(wait) + '<small>' + sub + '</small>';
      var frac = waitTotal > 0 ? Math.max(0, Math.min(1, 1 - wait / waitTotal)) : 0;
      arc.style.strokeDashoffset = String(216 * (1 - frac));
      return;
    }
    treat.disabled = !st.treats_allowed;
    treatlbl.innerHTML = 'Treat<small>' + st.treats_remaining + ' of ' + st.daily_quota + ' left</small>';
    arc.style.strokeDashoffset = 0;
  }

  function tickWait() {
    if (wait > 0) { wait--; }
    var s = lastState;
    if (s) renderTreat(s);
  }

  var lastState = null;
  function refresh() {
    var h = myToken ? { 'X-Control-Token': myToken } : {};
    fetch('/api/state', { headers: h }).then(function (r) { return r.json(); }).then(function (s) {
      lastState = s;
      if (driving && !s.you.driving) {
        // Turn ended. Drop the spent token: keeping it would make the next
        // join fail the server's cooldown check for a seat we no longer hold.
        myToken = '';
        sessionStorage.removeItem(tokenKey);
      }
      driving = s.you.driving;

      // header: temperature and humidity, nothing else
      if (s.coop.online && s.coop.has_climate) {
        $('meta').textContent = s.coop.climate.temperature.toFixed(1) + '°C · '
          + s.coop.climate.humidity.toFixed(0) + '%';
      } else {
        $('meta').textContent = '';
      }

      var night = s.coop.has_status && !s.coop.status.daylight;
      document.body.classList.toggle('night', night);
      document.body.classList.toggle('offline', !s.coop.online);
      // Someone else has the console: everything actuating greys out.
      document.body.classList.toggle('taken', s.queue.occupied && !s.you.driving);

      $('light').classList.toggle('on', s.coop.light_state === 'ON');

      // Server-computed countdown; the local ticker keeps it moving between
      // polls and this resyncs it.
      var w = s.treat_wait_seconds || 0;
      if (w > 0) {
        if (wait <= 0 || Math.abs(w - wait) > 3) wait = w;
        if (w > waitTotal || waitTotal === 0) waitTotal = w;
      } else {
        wait = 0; waitTotal = 0;
      }
      renderTreat(s);
    }).catch(function () {});
  }

  refresh();
  setInterval(refresh, 2000);
  ticker = setInterval(tickWait, 1000);
})();
</script>
</body>
</html>
